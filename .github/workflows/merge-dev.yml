name: Manual Merge dev → master

on:
  workflow_dispatch:          # 手动触发，不需要任何输入

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 消除 Node 20 警告（可选）

jobs:
  merge:
    runs-on: ubuntu-latest
    # 可选：只允许你自己运行（替换成你的 GitHub 用户名）
    # if: github.actor == '你的用户名'
    permissions:
      contents: write          # 明确授予写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 获取完整历史，以便合并
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into master
        run: |
          git fetch origin master
          git checkout master
          git merge origin/dev --no-ff -m "Manual merge dev → master (triggered via Pages CMS)"

      - name: Push changes
        run: git push origin master
